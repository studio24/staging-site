<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title_prefix_on_error }}{{ title }}</title>

    <!-- Staging site login functionality provided by Studio 24 - www.studio24.net -->

    <link rel="icon" href="data:,">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: "Arial MT Rounded Bold", Arial, sans-serif;
            font-size: 1.3rem;
            font-style: normal;
            font-weight: 400;
            line-height: 1.7;
        }

        .visuallyhidden {
            block-size: 1px;
            border: 0;
            clip-path: inset(50%);
            inline-size: 1px;
            overflow: hidden;
            padding: 0;
            position: absolute;
            white-space: nowrap;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1.3;
            margin-block-start: 0;
        }

        main {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 1em auto;
            max-inline-size: 24em;
            padding: 1.4em;
        }

        show-password {
            display: block;
        }

        show-password + * {
            margin-block-start: 20px;
        }

        label {
            display: block;
        }

        .input-group {
            align-items: center;
            display: flex;
            flex-flow: row wrap;
            gap: 20px;
            margin-block-start: 0;
        }

        input, button {
            border-radius: 5px;
            font-size: 1.2rem;
            padding: 10px;
        }

        input {
            border: 2px solid #aaa;
        }

        button {
            background-color: #007b00;
            border: 0;
            color: #fff;
            inline-size: 4em;
        }

        button:hover {
            background-color: #005600;
        }

        button[type=submit] {
            inline-size: 8em;
        }

        show-password button {
            background-color: #666;
        }

        show-password button:hover {
            background-color: #444;
        }

        .note-error {
            padding: 0.6em 0.6em 0.6em 2.4em;
            margin-bottom: 1em;
            background-color: #fef1f1;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path fill="%23a4141b" d="M15 17v-7a1 1 0 0 1 2 0v7a1 1 0 1 1-2 0Zm14-5.556v9.112a1.982 1.982 0 0 1-.586 1.414l-6.444 6.444a1.982 1.982 0 0 1-1.414.586h-9.112a1.982 1.982 0 0 1-1.414-.586L3.586 21.97A1.982 1.982 0 0 1 3 20.556v-9.112a1.983 1.983 0 0 1 .586-1.414l6.444-6.444A1.983 1.983 0 0 1 11.444 3h9.112a1.983 1.983 0 0 1 1.414.586l6.444 6.444A1.983 1.983 0 0 1 29 11.444Zm-2 0L20.556 5h-9.112L5 11.444v9.112L11.444 27h9.112L27 20.556v-9.112ZM16 20a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>');
            background-position: 0.6em 0.9em;
            background-repeat: no-repeat;
            background-size: 2rem;
            border: solid 1px;
            border-color: #f85156;
            color: #a4141b;
            border-inline-start-width: 4px;
        }

        .note-error h2 {
            font-size: 1.3rem;
            margin: 0;
        }

        .note-error p {
            margin: 0;
        }

        .field-error-msg {
            color: #a4141b;
            font-weight: 600;
            margin-block: 0.9375rem 0;
        }

        footer {
            color: #666;
            font-size: 0.8em;
            margin-block-start: 2.2em;
            text-align: center;
        }
    </style>
</head>

<body>

<main>

    {{ error_message }}
    <h1>{{ title }}</h1>
    <form method="post" action="{{ form_action }}">
        <input type="hidden" name="staging_site_login" value="yes">
        <show-password>
            <div>
                <label for="password-input">{{ password_field_label }}</label>
                {{ input_error_message }}
                <div class="input-group">
                    <input type="password" id="password-input" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" {{ input_aria_describedby }}>
                </div>
            </div>
        </show-password>
        <button type="submit">{{ submit_field_label }}</button>
    </form>

</main>
</div>
<footer>{{ footer }}</footer>
</body>

<script>
    customElements.define('show-password', class extends HTMLElement {

        /**
         * Instantiate our new component
         */
        constructor() {
            // tells new custom element to inherit properties of parent element (HTMLElement)
            super();

            // Define instance property
            this.input = this.querySelector('input[type=password]');

            // Create show button
            this.button = document.createElement('button');
            this.button.type = 'button';
            this.button.setAttribute('aria-controls', 'password-input');
            this.button.innerText = '{{ show }}';
            this.input.after(this.button);

            // Create and append a status region for updating screen readers.
            // This is injected between the input and button for a sensible reading order when
            // moving through the page content linearly:
            // [password input] -> [your password is visible/hidden] -> [show/hide password]
            this.screenReaderStatusMessage = document.createElement('div');
            this.screenReaderStatusMessage.setAttribute('class', 'visuallyhidden');
            this.screenReaderStatusMessage.setAttribute('aria-live', 'polite');
            this.input.after(this.screenReaderStatusMessage);

            // Listen for click events on the button, you can pass instance rather than callback function, this runs handleEvent
            this.button.addEventListener('click', this);
        }

        /**
         * Handle events
         * @param event The event object
         */
        handleEvent(event) {
            if (this.input.type === 'password') {
                this.showPassword();
            } else {
                this.hidePassword();
            }
        }

        showPassword() {
            this.input.type = 'text';
            this.button.innerText = '{{ hide }}';
            this.screenReaderStatusMessage.innerText = '{{ pw_shown }}';
        }

        hidePassword() {
            this.input.type = 'password';
            this.button.innerText = '{{ show }}';
            this.screenReaderStatusMessage.innerText = '{{ pw_hidden }}';
        }

    });
</script>

</html>
